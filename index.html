    <!-- Modern Kid-Friendly UI Stylesheet -->
    <style>
/* ==========================================================================
   Bé Tập Lập Trình: Ngã Tư Giao Thông 3D (Đinh Tiên Hoàng - Điện Biên Phủ)
   Style synchronized 100% with original web app (duy-nguyen-vo.github.io/nga-4)
   ========================================================================== */

* {
  box-sizing: border-box;
  font-family: Arial, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

body {
  margin: 0;
  padding: 0;
  background-color: #0f172a;
  color: #333;
  overflow: hidden;
  width: 100vw;
  height: 100vh;
}

/* 3D Canvas Container */
#canvas-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
}

/* UI Overlay Layer */
.ui-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 10;
  pointer-events: none;
}

.control-panel,
.ai-assistant,
.camera-quickbar,
.panel-reopen-btn {
  pointer-events: auto;
}

/* --- Floating Camera Quickbar --- */
.camera-quickbar {
  position: absolute;
  top: 15px;
  left: 15px;
  display: flex;
  gap: 6px;
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  padding: 6px 10px;
  border-radius: 25px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.25);
  border: 2px solid #fff;
  z-index: 110;
}

.cam-btn {
  background: #f8fafc;
  border: 1.5px solid #cbd5e1;
  color: #334155;
  font-weight: bold;
  font-size: 0.8rem;
  padding: 5px 10px;
  border-radius: 15px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 4px;
  transition: all 0.2s ease;
}

.cam-btn:hover {
  background: #e0f2fe;
  color: #0284c7;
  border-color: #38bdf8;
  transform: translateY(-1px);
}

.cam-btn.active {
  background: linear-gradient(135deg, #0284c7, #0369a1);
  color: #ffffff;
  border-color: transparent;
  box-shadow: 0 2px 8px rgba(2, 132, 199, 0.4);
}

.sound-btn {
  background: #fff;
  border: 1.5px solid #cbd5e1;
  border-radius: 50%;
  width: 30px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.9rem;
  cursor: pointer;
}

.sound-btn:hover {
  background: #f1f5f9;
}

/* --- Floating Open Button (when sidebar is collapsed) --- */
.panel-reopen-btn {
  position: absolute;
  top: 20px;
  right: 20px;
  background: linear-gradient(90deg, #ff9a9e 0%, #a18cd1 100%);
  color: white;
  border: 2px solid #fff;
  padding: 10px 16px;
  border-radius: 25px;
  font-weight: 900;
  font-size: 0.95rem;
  display: none;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  box-shadow: 0 6px 20px rgba(0,0,0,0.3);
  z-index: 105;
  animation: bounceIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.panel-reopen-btn.visible {
  display: flex;
}

.panel-reopen-btn:hover {
  transform: scale(1.05);
}

/* --- Main Sidebar Control Panel (100% Identical to Original Site) --- */
.control-panel {
  position: absolute;
  top: 15px;
  right: 15px;
  width: 335px;
  background-color: rgba(255, 255, 255, 0.96);
  border-radius: 15px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.35);
  border: 3px solid #fff;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  z-index: 100;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  max-height: calc(100vh - 30px);
}

.control-panel.collapsed {
  max-height: 54px; /* Only header visible */
}

/* Panel Header */
.panel-header {
  background: linear-gradient(90deg, rgba(255,154,158,1) 0%, rgba(161,140,209,1) 100%);
  padding: 12px 15px;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  user-select: none;
}

.panel-header h2 {
  color: white;
  margin: 0;
  border: none;
  padding: 0;
  font-size: 1.15rem;
  font-weight: 900;
  text-shadow: 1px 1px 2px rgba(0,0,0,0.25);
  display: flex;
  align-items: center;
  gap: 6px;
}

#toggle-icon {
  color: white;
  font-size: 1.1rem;
  transition: transform 0.3s;
}

.control-panel.collapsed #toggle-icon {
  transform: rotate(-90deg);
}

/* Panel Content Scrollable */
.panel-content {
  padding: 12px;
  overflow-y: auto;
  max-height: calc(100vh - 100px);
}

.panel-content::-webkit-scrollbar {
  width: 6px;
}
.panel-content::-webkit-scrollbar-thumb {
  background: rgba(161, 140, 209, 0.5);
  border-radius: 10px;
}

/* Control Sections */
.control-section {
  margin-bottom: 12px;
  background-color: #f3e5f5;
  padding: 10px;
  border-radius: 10px;
  border: 1px solid #e1bee7;
}

.section-spawn {
  background-color: #e0f7fa;
  border-color: #b2ebf2;
}

h3 {
  color: #00838f;
  margin-top: 0;
  margin-bottom: 8px;
  font-size: 0.95rem;
  font-weight: 900;
}

/* --- Section 1: Traffic Light Settings (2x2 Grid) --- */
.light-settings {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}

.light-group {
  padding: 6px;
  border-radius: 8px;
  border: 1px solid rgba(0,0,0,0.1);
}

.bg-north { background-color: #ffcdd2; }
.bg-south { background-color: #c8e6c9; }
.bg-east { background-color: #bbdefb; }
.bg-west { background-color: #fff9c4; }

.light-group h4 {
  margin: 0 0 4px 0;
  font-size: 0.82rem;
  text-align: center;
  font-weight: 900;
  color: #212121;
}

.input-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 3px;
  font-size: 0.8rem;
}

.input-row label {
  display: flex;
  align-items: center;
  font-weight: bold;
}

.dot {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  border: 1px solid #000;
}
.dot.g { background-color: #69f0ae; }
.dot.y { background-color: #ffd740; }
.dot.r { background-color: #ff5252; }

input[type="number"] {
  width: 42px;
  padding: 2px 4px;
  border: 1px solid #ccc;
  border-radius: 4px;
  font-weight: bold;
  text-align: center;
  font-size: 0.85rem;
  background: #fff;
}

select.start-color {
  padding: 2px;
  border-radius: 4px;
  border: 1px solid #ccc;
  font-size: 0.8rem;
  font-weight: bold;
  background: #fff;
}

/* --- Action Area Buttons --- */
.action-area {
  display: flex;
  gap: 8px;
  margin-top: 4px;
  margin-bottom: 12px;
}

.action-area button {
  padding: 10px;
  font-size: 0.95rem;
  font-weight: 900;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  letter-spacing: 0.5px;
  transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.btn-run {
  background-color: #64dd17;
  color: white;
  flex: 2;
  box-shadow: 0 4px 0 #33691e;
}
.btn-run:hover {
  background-color: #76ff03;
  transform: translateY(-2px);
  box-shadow: 0 6px 0 #33691e;
}
.btn-run:active {
  transform: translateY(2px);
  box-shadow: 0 2px 0 #33691e;
}

.btn-run.paused {
  background-color: #ff9800;
  box-shadow: 0 4px 0 #e65100;
}

.btn-reset {
  background-color: #ff1744;
  color: white;
  flex: 1;
  box-shadow: 0 4px 0 #b71c1c;
}
.btn-reset:hover {
  background-color: #ff5252;
  transform: translateY(-2px);
  box-shadow: 0 6px 0 #b71c1c;
}
.btn-reset:active {
  transform: translateY(2px);
  box-shadow: 0 2px 0 #b71c1c;
}

/* --- Section 2: Vehicle Spawner Station --- */
.spawn-form {
  padding: 4px;
}

.spawn-row {
  margin-bottom: 7px;
}

.spawn-row label {
  display: block;
  font-weight: 900;
  margin-bottom: 2px;
  font-size: 0.82rem;
  color: #006064;
}

.spawn-row select {
  width: 100%;
  padding: 4px 6px;
  border-radius: 5px;
  border: 2px solid #b2ebf2;
  font-size: 0.85rem;
  font-weight: bold;
  background: #fff;
  cursor: pointer;
}

.btn-add-car {
  background-color: #00e5ff;
  color: #006064;
  width: 100%;
  margin-top: 6px;
  padding: 10px;
  font-size: 1rem;
  font-weight: 900;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  letter-spacing: 1px;
  box-shadow: 0 4px 0 #00b8d4;
  transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.btn-add-car:hover {
  background-color: #18ffff;
  transform: translateY(-2px);
  box-shadow: 0 6px 0 #00b8d4;
}
.btn-add-car:active {
  transform: translateY(2px);
  box-shadow: 0 2px 0 #00b8d4;
}

/* Delete section */
.delete-section {
  margin-top: 10px;
  text-align: center;
  border-top: 2px dashed #b2ebf2;
  padding-top: 8px;
}

.delete-section label {
  font-weight: bold;
  color: #d32f2f;
  margin-bottom: 5px;
  display: block;
  font-size: 0.82rem;
}

#active-vehicles-list {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px;
  max-height: 90px;
  overflow-y: auto;
  padding: 4px;
}

/* --- Mascot AI Assistant --- */
.ai-assistant {
  position: fixed;
  bottom: 15px;
  left: 15px;
  display: flex;
  flex-direction: row;
  align-items: flex-end;
  z-index: 100;
  pointer-events: auto;
}

.ai-bubble {
  background-color: #fff;
  border: 4px solid #6200ea;
  border-radius: 20px;
  padding: 10px 14px;
  margin-left: 12px;
  margin-bottom: 15px;
  box-shadow: 0 5px 12px rgba(0,0,0,0.25);
  font-size: 0.95rem;
  font-weight: 900;
  color: #311b92;
  max-width: 260px;
  text-align: center;
  position: relative;
  animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.ai-bubble::after {
  content: '';
  position: absolute;
  bottom: 12px;
  left: -14px;
  border-width: 8px 14px 8px 0;
  border-style: solid;
  border-color: transparent #6200ea transparent transparent;
  display: block;
  width: 0;
}
.ai-bubble::before {
  content: '';
  position: absolute;
  bottom: 15px;
  left: -9px;
  border-width: 5px 10px 5px 0;
  border-style: solid;
  border-color: transparent #fff transparent transparent;
  display: block;
  width: 0;
  z-index: 1;
}

.ai-character {
  font-size: 60px;
  filter: drop-shadow(0 5px 5px rgba(0,0,0,0.3));
  animation: floatAI 3s infinite ease-in-out;
  cursor: pointer;
  user-select: none;
  transition: transform 0.2s;
}

.ai-character:hover {
  transform: scale(1.1);
}

/* Animations */
@keyframes floatAI {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

@keyframes popIn {
  0% { transform: scale(0); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

@keyframes bounceIn {
  0% { transform: scale(0.6); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

.ai-shake {
  animation: aiShake 0.5s;
}

@keyframes aiShake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-10px) rotate(-10deg); }
  75% { transform: translateX(10px) rotate(10deg); }
}

.wiggle-hover:hover:not(:disabled) {
  animation: wiggle 0.5s ease-in-out infinite;
}

@keyframes wiggle {
  0%, 100% { transform: rotate(0deg); }
  25% { transform: rotate(-3deg); }
  75% { transform: rotate(3deg); }
}

/* Responsive */
@media (max-width: 768px) {
  .control-panel {
    width: 290px;
  }
  .ai-assistant {
    left: 8px;
    bottom: 8px;
  }
  .ai-bubble {
    font-size: 0.85rem;
    max-width: 200px;
  }
}

</style>

        <div class="loader-title">Bé Tập Lập Trình: Ngã Tư Giao Thông 3D</div>
        <div class="loader-subtitle">Đang nạp mô hình 3D Đinh Tiên Hoàng - Điện Biên Phủ...</div>
    </div>

    <!-- 3D Canvas Mount Point -->
    <div id="canvas-container"></div>

    <!-- Three.js Library & Addons (CDN) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- Application Modules -->

<script type="module">
// ===== SCENE.JS (isolated module scope) =====
(function () {
/**
 * Bé Tập Lập Trình: Ngã Tư Đinh Tiên Hoàng - Điện Biên Phủ (3D)
 * Module: Scene & 3D World Setup
 * 
 * Provides:
 * - Three.js WebGLRenderer, Scene, PerspectiveCamera (top-down 3rd person & presets)
 * - OrbitControls for pan/zoom/rotate
 * - 4-Way Intersection Roadbed (Đinh Tiên Hoàng x Điện Biên Phủ)
 * - Realistic asphalt, lane markings, pedestrian zebra crossings, stop lines, sidewalks
 * - Trajectory & Waypoint system for @traffic
 * - Anchor definitions for @landmarks
 * - Animation loop with callback registry
 */

// Ensure THREE is available
const THREE = window.THREE;
if (!THREE) {
    console.error("Three.js not found! Ensure three.min.js is loaded before scene.js");
}

// -------------------------------------------------------------
// 1. Basic Three.js Setup (Scene, Camera, Renderer, Controls)
// -------------------------------------------------------------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbde0fe); // Crisp, pleasant sky blue
scene.fog = new THREE.FogExp2(0xbde0fe, 0.0035);
const camera = new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.5,
    1000
);

// Top-down 3rd person camera viewing down at intersection (~55-60 degree pitch)
camera.position.set(0, 68, 52);
camera.lookAt(0, 0, 0);

// Container element for canvas
let container = document.getElementById('canvas-container');
if (!container) {
    container = document.createElement('div');
    container.id = 'canvas-container';
    document.body.prepend(container);
}
const renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: 'high-performance'
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
container.appendChild(renderer.domElement);

// OrbitControls
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.screenSpacePanning = true;
controls.target.set(0, 0, 0);
controls.maxPolarAngle = Math.PI / 2 - 0.05; // Prevent camera clipping below ground
controls.minDistance = 12;
controls.maxDistance = 240;

// Camera view presets
function setCameraPreset(preset) {
    if (!preset) return;
    const p = preset.toLowerCase();
    
    let targetPos = new THREE.Vector3(0, 68, 52);
    let targetLook = new THREE.Vector3(0, 0, 0);

    if (p === 'top') {
        targetPos.set(0, 100, 0.1);
        targetLook.set(0, 0, 0);
    } else if (p === 'iso') {
        targetPos.set(60, 60, 60);
        targetLook.set(0, 0, 0);
    } else if (p === 'driver') {
        targetPos.set(4.2, 3.5, 38);
        targetLook.set(4.2, 1.5, 0);
    } else if (p === 'school') {
        // Look at Bottom-Left: Trường Tiểu học Đinh Tiên Hoàng
        targetPos.set(-14, 16, 14);
        targetLook.set(-36, 5, 36);
    }

    camera.position.copy(targetPos);
    controls.target.copy(targetLook);
    controls.update();
    camera.lookAt(targetLook);
}

// -------------------------------------------------------------
// 2. Lighting & Atmosphere
// -------------------------------------------------------------

// Hemisphere fill light (Sky & Ground bounce)
const hemiLight = new THREE.HemisphereLight(0xf2f7ff, 0x5a6652, 0.75);
hemiLight.position.set(0, 100, 0);
scene.add(hemiLight);

// Primary Directional Sunlight
const sunLight = new THREE.DirectionalLight(0xfffaec, 1.15);
sunLight.position.set(50, 80, 40);
sunLight.castShadow = true;
sunLight.shadow.mapSize.width = 2048;
sunLight.shadow.mapSize.height = 2048;
sunLight.shadow.camera.near = 10;
sunLight.shadow.camera.far = 240;
sunLight.shadow.camera.left = -70;
sunLight.shadow.camera.right = 70;
sunLight.shadow.camera.top = 70;
sunLight.shadow.camera.bottom = -70;
sunLight.shadow.bias = -0.0004;
scene.add(sunLight);

// Soft backlight / secondary fill
const fillLight = new THREE.DirectionalLight(0xc6dcff, 0.35);
fillLight.position.set(-45, 55, -45);
scene.add(fillLight);

// Ambient subtle warm light
const ambientLight = new THREE.AmbientLight(0xffffff, 0.25);
scene.add(ambientLight);

// -------------------------------------------------------------
// 3. Ground Base
// -------------------------------------------------------------

// Large grassy terrain ground
const groundGeo = new THREE.PlaneGeometry(600, 600);
const groundMat = new THREE.MeshStandardMaterial({
    color: 0x58785e, // Pleasant city park green
    roughness: 0.9,
    metalness: 0.05
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.01;
ground.receiveShadow = true;
scene.add(ground);

// -------------------------------------------------------------
// 4. Roadbed Configuration (Đinh Tiên Hoàng x Điện Biên Phủ)
// -------------------------------------------------------------

/**
 * Coordinate Reference System:
 * - Center of intersection: (0, 0, 0)
 * - North (-Z) / South (+Z): Đường Đinh Tiên Hoàng
 *   + South (+Z): Towards District 1 (Lê Duẩn)
 *   + North (-Z): Towards Bình Thạnh (Cầu Bông)
 * - West (-X) / East (+X): Đường Điện Biên Phủ
 *   + West (-X): Towards Ngã tư Hàng Xanh / Vòng xoay ĐBP
 *   + East (+X): Towards Đa Kao / Vòng xoay Dân Chủ
 * - Road Width: 30 units (Half-width: 15)
 * - Right-hand traffic in Vietnam:
 *   + Southbound (North to South, heading +Z): drives on West side (X < 0)
 *   + Northbound (South to North, heading -Z): drives on East side (X > 0)
 *   + Eastbound (West to East, heading +X): drives on South side (Z > 0)
 *   + Westbound (East to West, heading -X): drives on North side (Z < 0)
 */
const roadConfig = {
    roadWidth: 30,
    roadHalfWidth: 15,
    roadArmLength: 150,
    stopDistance: 18.0,
    stopLineWidth: 0.8,
    zebraStart: 15.3,
    zebraEnd: 17.5,
    zebraStripeWidth: 0.6,
    innerLaneOffset: 4.2,   // Center of inner lane (cars, buses, left turns)
    outerLaneOffset: 10.5,  // Center of outer lane (motorbikes, cars, right turns)
    sidewalkWidth: 35.0,
    sidewalkHeight: 0.28,
    cornerCurvRadius: 3.5

function buildDashedLineZ(xPos, startZ, endZ) {
    const dashLen = 3.0;
    const gapLen = 3.0;
    const totalStep = dashLen + gapLen;
    const dist = Math.abs(endZ - startZ);
    const count = Math.floor(dist / totalStep);
    const dir = Math.sign(endZ - startZ);

    for (let i = 0; i < count; i++) {
        const curZ = startZ + dir * (i * totalStep + dashLen / 2);
        markingsGroup.add(createMarkingPlane(0.2, dashLen, whiteMarkingMat, xPos, curZ));
    }
}

function buildDashedLineX(zPos, startX, endX) {
    const dashLen = 3.0;
    const gapLen = 3.0;
    const totalStep = dashLen + gapLen;
    const dist = Math.abs(endX - startX);
    const count = Math.floor(dist / totalStep);
    const dir = Math.sign(endX - startX);

    for (let i = 0; i < count; i++) {
        const curX = startX + dir * (i * totalStep + dashLen / 2);
        markingsGroup.add(createMarkingPlane(dashLen, 0.2, whiteMarkingMat, curX, zPos));
    }
}

/**
 * Build a sidewalk corner block with rounded fillet curb at the intersection.
 * @param {number} dirX -1 for West, +1 for East
 * @param {number} dirZ -1 for North, +1 for South
 */
function createSidewalkCorner(dirX, dirZ, name) {
    const group = new THREE.Group();
    group.name = name;

    // Corner center for curve:
    const cx = dirX * (RW + R);
    const cz = dirZ * (RW + R);

    // 2D Shape for sidewalk with rounded fillet
    const shape = new THREE.Shape();
    
    // Start far outer corner
    const farX = dirX * (RW + swW);
    const farZ = dirZ * (RW + swW);

    shape.moveTo(farX, farZ);
    shape.lineTo(dirX * RW, farZ);
    shape.lineTo(dirX * RW, cz);
    
    // Arc at the intersection corner
    // Angles depending on quadrant:
    let startAngle = 0;
    let endAngle = 0;
    if (dirX > 0 && dirZ > 0) { // Bottom-Right (SE)
        startAngle = Math.PI;
        endAngle = Math.PI / 2;
    } else if (dirX < 0 && dirZ > 0) { // Bottom-Left (SW)
        startAngle = 0;
        endAngle = Math.PI / 2;
    } else if (dirX < 0 && dirZ < 0) { // Top-Left (NW)
        startAngle = 0;
        endAngle = -Math.PI / 2;
    } else if (dirX > 0 && dirZ < 0) { // Top-Right (NE)
        startAngle = Math.PI;
        endAngle = 3 * Math.PI / 2;
    }

    shape.absarc(cx, cz, R, startAngle, endAngle, dirX * dirZ < 0);
    shape.lineTo(cx, dirZ * RW);
    shape.lineTo(farX, dirZ * RW);
    shape.closePath();

    const extrudeSettings = {
        depth: swH,
        bevelEnabled: true,
        bevelSegments: 2,
        steps: 1,
        bevelSize: 0.08,
        bevelThickness: 0.06
    };

    const geom = new THREE.ExtrudeGeometry(shape, extrudeSettings);
    // Extrude geometry defaults along Z, rotate to sit on ground (along Y)
    geom.rotateX(Math.PI / 2);
    geom.translate(0, swH, 0);

    const mesh = new THREE.Mesh(geom, sidewalkMat);
    mesh.receiveShadow = true;
    mesh.castShadow = true;
    group.add(mesh);

    // Curb edge line (stone border)
    const curbBorderGeo = new THREE.BoxGeometry(swW, 0.05, 0.4);
    
    return group;
}

/**
 * Build Catmull-Rom or Bezier spline points for smooth vehicle steering.
 * 4 Origin Directions: 'north', 'south', 'east', 'west'
 * 3 Turning Paths: 'straight', 'left', 'right'
 */
function createSplinePath(controlPoints, numSamples = 60) {
    const vectors = controlPoints.map(p => new THREE.Vector3(p.x, p.y || 0, p.z));
    const curve = new THREE.CatmullRomCurve3(vectors, false, 'centripetal', 0.2);
    const points = curve.getPoints(numSamples);
    const totalLength = curve.getLength();

    return {
        curve,
        points,
        totalLength,
        getPointAt: (t) => curve.getPointAt(Math.max(0, Math.min(1, t))),
        getTangentAt: (t) => curve.getTangentAt(Math.max(0, Math.min(1, t)))
    };
}

        left: createSplinePath([
            { x: -inner, z: -arm },
            { x: -inner, z: -stop },
            { x: -(inner - 0.5), z: -4 },
            { x: 0, z: inner - 1 },
            { x: stop, z: inner },
            { x: arm, z: inner }
        ])
    },

    // ----------------- EAST (Origin: East +X, heading West -X) -----------------
    east: {
        origin: 'east',
        inboundHeading: Math.PI,
        stopLine: { x: stop, y: 0, z: -inner },
        
        straight: createSplinePath([
            { x: arm, z: -inner },
            { x: stop + 2, z: -inner },
            { x: 0, z: -inner },
            { x: -(stop + 2), z: -inner },
            { x: -arm, z: -inner }
        ]),
        
        // Turn Right: onto Northbound Đinh Tiên Hoàng (-Z)
        right: createSplinePath([
            { x: arm, z: -outer },
            { x: stop + 1, z: -outer },
            { x: 12, z: -(outer + 1) },
            { x: outer + 1, z: -12 },
            { x: outer, z: -(stop + 1) },
            { x: outer, z: -arm }
        ]),
        
        // Turn Left: onto Southbound Đinh Tiên Hoàng (+Z)
        left: createSplinePath([
            { x: arm, z: -inner },
            { x: stop, z: -inner },
            { x: 4, z: -(inner - 0.5) },
            { x: -inner + 1, z: 0 },
            { x: -inner, z: stop },
            { x: -inner, z: arm }
        ])
    },

    // ----------------- WEST (Origin: West -X, heading East +X) -----------------
    west: {
        origin: 'west',
        inboundHeading: 0,
        stopLine: { x: -stop, y: 0, z: inner },
        
        straight: createSplinePath([
            { x: -arm, z: inner },
            { x: -(stop + 2), z: inner },
            { x: 0, z: inner },
            { x: stop + 2, z: inner },
            { x: arm, z: inner }
        ]),
        
        // Turn Right: onto Southbound Đinh Tiên Hoàng (+Z)
        right: createSplinePath([
            { x: -arm, z: outer },
            { x: -(stop + 1), z: outer },
            { x: -12, z: outer + 1 },
            { x: -(outer + 1), z: 12 },
            { x: -outer, z: stop + 1 },
            { x: -outer, z: arm }
        ]),
        
        // Turn Left: onto Northbound Đinh Tiên Hoàng (-Z)
        left: createSplinePath([
            { x: -arm, z: inner },
            { x: -stop, z: inner },
            { x: -4, z: inner - 0.5 },
            { x: inner - 1, z: 0 },
            { x: inner, z: -stop },
            { x: inner, z: -arm }
        ])
    }
};

// 9. Animation Loop & Callback System
// -------------------------------------------------------------

const animationCallbacks = [];
function addAnimationCallback(fn) {
    if (typeof fn === 'function') {
        animationCallbacks.push(fn);
    }
}
function removeAnimationCallback(fn) {
    const idx = animationCallbacks.indexOf(fn);
    if (idx !== -1) animationCallbacks.splice(idx, 1);
}

const clock = new THREE.Clock();

function animate(timestamp) {
    requestAnimationFrame(animate);
    const delta = Math.min(clock.getDelta(), 0.1); // Cap delta to prevent huge jumps

    // OrbitControls update
    controls.update();

    // Run registered module callbacks (@traffic, @landmarks, etc.)
    for (let i = 0; i < animationCallbacks.length; i++) {
        try {
            animationCallbacks[i](delta, timestamp);
        } catch (err) {
            console.error("Error in animation callback:", err);
        }
    }

    renderer.render(scene, camera);
}

// Start rendering loop immediately
requestAnimationFrame(animate);

window.addEventListener('resize', onWindowResize, false);
function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

// Shared material factory with caching
const materialCache = new Map();

function getCachedMaterial(type, params) {
  const key = `${type}_${JSON.stringify(params)}`;
  if (!materialCache.has(key)) {
    let mat;
    if (type === 'standard') {
      mat = new THREE.MeshStandardMaterial(params);
    } else if (type === 'basic') {
      mat = new THREE.MeshBasicMaterial(params);
    } else {
      mat = new THREE.MeshLambertMaterial(params);
    }
    materialCache.set(key, mat);
  }
  return materialCache.get(key);
}

function createTextTexture(text, bgColor = '#ffffff', textColor = '#000000', fontSize = 28, subText = '') {
  const canvas = document.createElement('canvas');
  canvas.width = 256;
  canvas.height = 64;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = bgColor;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = textColor;
  ctx.lineWidth = 3;
  ctx.strokeRect(2, 2, canvas.width - 4, canvas.height - 4);

  ctx.fillStyle = textColor;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `bold ${fontSize}px Arial, sans-serif`;
  ctx.fillText(text, canvas.width / 2, subText ? 24 : 32);

  if (subText) {
    ctx.font = `bold 16px Arial, sans-serif`;
    ctx.fillText(subText, canvas.width / 2, 48);
  }

  const texture = new THREE.CanvasTexture(canvas);
  texture.anisotropy = 4;
  return texture;
}

function createWheel(radius = 0.42, width = 0.26, rimColor = 0xd4d4d8) {
  const wheelGroup = new THREE.Group();
  wheelGroup.name = "Wheel";

  const tireGeo = new THREE.CylinderGeometry(radius, radius, width, 18);
  tireGeo.rotateZ(Math.PI / 2);
  const tire = new THREE.Mesh(tireGeo, MAT_RUBBER);
  tire.castShadow = true;
  tire.receiveShadow = true;
  wheelGroup.add(tire);

  const rimGeo = new THREE.CylinderGeometry(radius * 0.65, radius * 0.65, width + 0.02, 12);
  rimGeo.rotateZ(Math.PI / 2);
  const rimMat = getCachedMaterial('standard', { color: rimColor, roughness: 0.3, metalness: 0.8 });
  const rim = new THREE.Mesh(rimGeo, rimMat);
  wheelGroup.add(rim);

  const boltGeo = new THREE.CylinderGeometry(radius * 0.2, radius * 0.2, width + 0.04, 8);
  boltGeo.rotateZ(Math.PI / 2);
  const bolt = new THREE.Mesh(boltGeo, MAT_CHROME);
  wheelGroup.add(bolt);

  return wheelGroup;
}

  riderGroup.add(strap);

  group.add(riderGroup);

  return { mesh: group, wheels, length: 2.3, width: 0.9, height: 1.95 };
}
function createVehicleModel(type = 'car', options = {}) {
  const t = String(type).toLowerCase();
  if (t === 'taxi') {
    return createTaxiModel(options);
  } else if (t === 'bus') {
    return createBusModel(options);
  } else if (t === 'bike' || t === 'motorbike') {
    return createMotorbikeModel(options);
  } else {
    return createCarModel(options);
  }
}

// -------------------------------------------------------------
// 3. Trajectory & Waypoint Paths (Optimized for Visibility)
// -------------------------------------------------------------

function buildSpline(controlPoints, numSamples = 60) {
  const vectors = controlPoints.map(p => new THREE.Vector3(p.x, p.y || 0.04, p.z));
  const curve = new THREE.CatmullRomCurve3(vectors, false, 'centripetal', 0.2);
  const points = curve.getPoints(numSamples);
  const totalLength = curve.getLength();

  return {
    curve,
    points,
    totalLength,
    getPointAt: (t) => curve.getPointAt(Math.max(0, Math.min(1, t))),
    getTangentAt: (t) => curve.getTangentAt(Math.max(0, Math.min(1, t)))
  };
}

/**
 * Creates visible-range waypoint paths:
 * Starts at 46 units from center (within camera view),
 * crosses stop lines at 18 units, navigates intersection [-18, 18],
 * and exits cleanly at 48 units.
 */
function createVisibleWaypoints() {
  const inner = 4.2;   // inner lane center (straight, left)
  const outer = 10.5;  // outer lane center (straight, right)
  const spawnD = 46.0; // visible spawn distance from center
  const exitD = 50.0;  // despawn exit distance
  const stopD = 18.0;  // stop line distance

  return {
    // ----------------- SOUTH (Origin: South +Z, heading North -Z) -----------------
    south: {
      origin: 'south',
      stopLineDist: spawnD - stopD, // ~28.0
      straight: buildSpline([
        { x: inner, z: spawnD },
        { x: inner, z: stopD + 1 },
        { x: inner, z: 0 },
        { x: inner, z: -(stopD + 1) },
        { x: inner, z: -exitD }
      ]),
      right: buildSpline([
        { x: outer, z: spawnD },
        { x: outer, z: stopD + 0.5 },
        { x: outer + 1, z: 12 },
        { x: 12, z: outer + 1 },
        { x: stopD + 0.5, z: outer },
        { x: exitD, z: outer }
      ]),
      left: buildSpline([
        { x: inner, z: spawnD },
        { x: inner, z: stopD },
        { x: inner - 0.5, z: 4 },
        { x: 0, z: -inner + 1 },
        { x: -stopD, z: -inner },
        { x: -exitD, z: -inner }
      ])
    },

    // ----------------- NORTH (Origin: North -Z, heading South +Z) -----------------
    north: {
      origin: 'north',
      stopLineDist: spawnD - stopD,
      straight: buildSpline([
        { x: -inner, z: -spawnD },
        { x: -inner, z: -(stopD + 1) },
        { x: -inner, z: 0 },
        { x: -inner, z: stopD + 1 },
        { x: -inner, z: exitD }
      ]),
      right: buildSpline([
        { x: -outer, z: -spawnD },
        { x: -outer, z: -(stopD + 0.5) },
        { x: -(outer + 1), z: -12 },
        { x: -12, z: -(outer + 1) },
        { x: -(stopD + 0.5), z: -outer },
        { x: -exitD, z: -outer }
      ]),
      left: buildSpline([
        { x: -inner, z: -spawnD },
        { x: -inner, z: -stopD },
        { x: -(inner - 0.5), z: -4 },
        { x: 0, z: inner - 1 },
        { x: stopD, z: inner },
        { x: exitD, z: inner }
      ])
    },

    // ----------------- EAST (Origin: East +X, heading West -X) -----------------
    east: {
      origin: 'east',
      stopLineDist: spawnD - stopD,
      straight: buildSpline([
        { x: spawnD, z: -inner },
        { x: stopD + 1, z: -inner },
        { x: 0, z: -inner },
        { x: -(stopD + 1), z: -inner },
        { x: -exitD, z: -inner }
      ]),
      right: buildSpline([
        { x: spawnD, z: -outer },
        { x: stopD + 0.5, z: -outer },
        { x: 12, z: -(outer + 1) },
        { x: outer + 1, z: -12 },
        { x: outer, z: -(stopD + 0.5) },
        { x: outer, z: -exitD }
      ]),
      left: buildSpline([
        { x: spawnD, z: -inner },
        { x: stopD, z: -inner },
        { x: 4, z: -(inner - 0.5) },
        { x: -inner + 1, z: 0 },
        { x: -inner, z: stopD },
        { x: -inner, z: exitD }
      ])
    },

    // ----------------- WEST (Origin: West -X, heading East +X) -----------------
    west: {
      origin: 'west',
      stopLineDist: spawnD - stopD,
      straight: buildSpline([
        { x: -spawnD, z: inner },
        { x: -(stopD + 1), z: inner },
        { x: 0, z: inner },
        { x: stopD + 1, z: inner },
        { x: exitD, z: inner }
      ]),
      right: buildSpline([
        { x: -spawnD, z: outer },
        { x: -(stopD + 0.5), z: outer },
        { x: -12, z: outer + 1 },
        { x: -(outer + 1), z: 12 },
        { x: -outer, z: stopD + 0.5 },
        { x: -outer, z: exitD }
      ]),
      left: buildSpline([
        { x: -spawnD, z: inner },
        { x: -stopD, z: inner },
        { x: -4, z: inner - 0.5 },
        { x: inner - 1, z: 0 },
        { x: inner, z: -stopD },
        { x: inner, z: -exitD }
      ])
    }
  };
}

// 4. 3D Particle Explosion Effect System (💥)
// -------------------------------------------------------------
class ExplosionSystem {
  constructor(scene) {
    this.scene = scene;
    this.activeExplosions = [];
  }

  createExplosion(position) {
    if (!this.scene) return;

    const explosionGroup = new THREE.Group();
    explosionGroup.position.copy(position);
    this.scene.add(explosionGroup);

    const particles = [];
    const sparkGeo = new THREE.BoxGeometry(0.14, 0.14, 0.14);
    const colors = [0xff4500, 0xffa500, 0xffdd00, 0xff0000, 0xffffff];

    // Fiery flying sparks
    for (let i = 0; i < 70; i++) {
      const col = colors[Math.floor(Math.random() * colors.length)];
      const sparkMat = new THREE.MeshBasicMaterial({ color: col });
      const mesh = new THREE.Mesh(sparkGeo, sparkMat);

      const theta = Math.random() * Math.PI * 2;
      const phi = Math.random() * Math.PI * 0.7;
      const speed = 5.0 + Math.random() * 11.0;

      const vel = new THREE.Vector3(
        Math.sin(phi) * Math.cos(theta) * speed,
        Math.cos(phi) * speed + 2.5,
        Math.sin(phi) * Math.sin(theta) * speed
      );

      mesh.position.set(0, 0.2, 0);
      explosionGroup.add(mesh);

      particles.push({
        mesh,
        vel,
        rotSpeed: new THREE.Vector3(
          (Math.random() - 0.5) * 15,
          (Math.random() - 0.5) * 15,
          (Math.random() - 0.5) * 15
        ),
        type: 'spark'
      });
    }

    // Smoke puffs
    const smokeGeo = new THREE.SphereGeometry(0.45, 8, 8);
    const smokeMat = new THREE.MeshLambertMaterial({
      color: 0x475569,
      transparent: true,
      opacity: 0.8
    });

    for (let i = 0; i < 14; i++) {
      const sMesh = new THREE.Mesh(smokeGeo, smokeMat.clone());
      sMesh.position.set(
        (Math.random() - 0.5) * 1.5,
        0.5 + Math.random() * 1.0,
        (Math.random() - 0.5) * 1.5
      );
      explosionGroup.add(sMesh);

      particles.push({
        mesh: sMesh,
        vel: new THREE.Vector3(
          (Math.random() - 0.5) * 2.0,
          1.8 + Math.random() * 2.5,
          (Math.random() - 0.5) * 2.0
        ),
        scaleSpeed: 1.8 + Math.random() * 2.0,
        type: 'smoke'
      });
    }

    // Ground shockwave ring
    const ringGeo = new THREE.RingGeometry(0.2, 0.7, 32);
    ringGeo.rotateX(-Math.PI / 2);
    const ringMat = new THREE.MeshBasicMaterial({
      color: 0xffaa00,
      side: THREE.DoubleSide,
      transparent: true,
      opacity: 0.95
    });
    const shockwave = new THREE.Mesh(ringGeo, ringMat);
    shockwave.position.y = 0.05;
    explosionGroup.add(shockwave);

    // Flash light
    const flashLight = new THREE.PointLight(0xff6600, 6.0, 35);
    flashLight.position.set(0, 2.5, 0);
    explosionGroup.add(flashLight);

    // 3D Emoji Sprite (💥)
    const emojiCanvas = document.createElement('canvas');
    emojiCanvas.width = 128;
    emojiCanvas.height = 128;
    const eCtx = emojiCanvas.getContext('2d');
    eCtx.font = '96px Arial, sans-serif';
    eCtx.textAlign = 'center';
    eCtx.textBaseline = 'middle';
    eCtx.fillText('💥', 64, 64);
    const emojiTex = new THREE.CanvasTexture(emojiCanvas);
    const spriteMat = new THREE.SpriteMaterial({ map: emojiTex, transparent: true });
    const emojiSprite = new THREE.Sprite(spriteMat);
    emojiSprite.scale.set(4.5, 4.5, 1);
    emojiSprite.position.set(0, 3.2, 0);
    explosionGroup.add(emojiSprite);

    this.activeExplosions.push({
      group: explosionGroup,
      particles,
      shockwave,
      flashLight,
      emojiSprite,
      age: 0,
      maxAge: 2.2
    });
  }

  update(delta) {
    for (let i = this.activeExplosions.length - 1; i >= 0; i--) {
      const exp = this.activeExplosions[i];
      exp.age += delta;
      const progress = exp.age / exp.maxAge;

      for (let j = 0; j < exp.particles.length; j++) {
        const p = exp.particles[j];
        if (p.type === 'spark') {
          p.vel.y -= 12.0 * delta;
          p.mesh.position.addScaledVector(p.vel, delta);
          p.mesh.rotation.x += p.rotSpeed.x * delta;
          p.mesh.rotation.y += p.rotSpeed.y * delta;
          if (p.mesh.position.y < 0.06) {
            p.mesh.position.y = 0.06;
            p.vel.y = -p.vel.y * 0.45;
            p.vel.x *= 0.7;
            p.vel.z *= 0.7;
          }
          const scale = Math.max(0, 1 - progress);
          p.mesh.scale.setScalar(scale);
        } else if (p.type === 'smoke') {
          p.mesh.position.addScaledVector(p.vel, delta);
          p.mesh.scale.addScalar(p.scaleSpeed * delta);
          if (p.mesh.material) {
            p.mesh.material.opacity = Math.max(0, 0.8 * (1 - progress));
          }
        }
      }

      if (exp.shockwave) {
        const ringScale = 1.0 + progress * 22.0;
        exp.shockwave.scale.set(ringScale, ringScale, 1);
        exp.shockwave.material.opacity = Math.max(0, 0.95 * (1 - progress * 1.5));
      }

      if (exp.flashLight) {
        exp.flashLight.intensity = Math.max(0, 6.0 * (1 - progress * 4.0));
      }

      if (exp.emojiSprite) {
        exp.emojiSprite.position.y += delta * 1.8;
        exp.emojiSprite.material.opacity = Math.max(0, 1.0 - progress * 1.2);
      }

      if (exp.age >= exp.maxAge) {
        if (exp.group.parent) exp.group.parent.remove(exp.group);
        this.activeExplosions.splice(i, 1);
      }
    }
  }

  clear() {
    this.activeExplosions.forEach(exp => {
      if (exp.group.parent) exp.group.parent.remove(exp.group);
    });
    this.activeExplosions = [];
  }
}

// 5. Vehicle Entity Class
// -------------------------------------------------------------
class Vehicle {
  constructor(options = {}) {
    this.id = options.id || ('veh_' + Date.now() + '_' + Math.floor(Math.random() * 1000));
    this.type = options.type || 'car';
    this.origin = options.origin || 'south';
    this.turn = options.turn || 'straight';
    this.color = options.color || '#3b82f6';
    this.taxiType = options.taxiType || 'mailinh';

    const modelData = createVehicleModel(this.type, {
      color: this.color,
      taxiType: this.taxiType
    });

    this.mesh = modelData.mesh;
    this.wheels = modelData.wheels || [];
    this.length = modelData.length || 4.4;
    this.width = modelData.width || 2.1;
    this.height = modelData.height || 1.7;

    this.pathData = options.pathData || null;
    this.totalLength = this.pathData ? this.pathData.totalLength : 96;
    this.stopLineDistance = options.stopLineDistance || 28.0;

    this.initialProgress = options.initialProgress !== undefined ? options.initialProgress : 0;
    this.progress = this.initialProgress;
    this.speed = 0;
    this.age = 0; // Time since spawn
    this._safeReported = false;

    // Programmed delay before departure (seconds)
    this.initialDelay = Math.max(0, parseFloat(options.delay || options.startDelay || options.delaySeconds || 0));
    this.delayRemaining = this.initialDelay;

    // Configurable travel speed
    let baseSpeed = 12.0;
    if (this.type === 'bike') {
      baseSpeed = 13.0;
      this.acceleration = 11.0;
      this.deceleration = 16.0;
    } else if (this.type === 'bus') {
      baseSpeed = 9.5;
      this.acceleration = 6.0;
      this.deceleration = 10.0;
    } else {
      baseSpeed = 12.0;
      this.acceleration = 8.5;
      this.deceleration = 14.0;
    }

    if (options.speed !== undefined && options.speed !== null && options.speed !== '') {
      const numSpeed = parseFloat(options.speed);
      if (!isNaN(numSpeed) && numSpeed > 0) {
        baseSpeed = numSpeed;
      } else if (options.speed === 'slow') {
        baseSpeed *= 0.65;
      } else if (options.speed === 'fast') {
        baseSpeed *= 1.5;
      }
    }
    if (options.speedMultiplier) {
      const mult = parseFloat(options.speedMultiplier);
      if (!isNaN(mult) && mult > 0) baseSpeed *= mult;
    }
    this.targetSpeed = baseSpeed;

    // Free Run Mode (Chạy tự do - Bỏ qua đèn)
    const isFreeRun = (
      options.ignoreLights === true ||
      options.ignoreLight === true ||
      options.freeRun === true ||
      options.lightMode === 'ignore' ||
      options.lightMode === 'free' ||
      options.lightMode === 'free_run' ||
      options.mode === 'free' ||
      options.mode === 'free_run' ||
      options.lightBehavior === 'ignore'
    );
    this.ignoreLights = isFreeRun;

    this.crashed = false;
    this.passedStopLine = false;
    this.completed = false;
    this.active = true;

    // Position at start
    if (this.pathData) {
      const t = Math.max(0, Math.min(1, this.progress / this.totalLength));
      const pt = this.pathData.getPointAt(t);
      const tangent = this.pathData.getTangentAt(t);
      this.mesh.position.set(pt.x, pt.y || 0.04, pt.z);
      this.mesh.rotation.y = Math.atan2(tangent.x, tangent.z);
    }
  }

  resetPosition(scene) {
    this.progress = this.initialProgress;
    this.speed = 0;
    this.age = 0;
    this.delayRemaining = this.initialDelay;
    this.crashed = false;
    this.passedStopLine = false;
    this.completed = false;
    this.active = true;
    this._safeReported = false;

    // Reset mesh orientation & tilt from collision recoil
    this.mesh.rotation.set(0, 0, 0);

    if (this.pathData) {
      const t = Math.max(0, Math.min(1, this.progress / this.totalLength));
      const pt = this.pathData.getPointAt(t);
      const tangent = this.pathData.getTangentAt(t);
      this.mesh.position.set(pt.x, pt.y || 0.04, pt.z);
      this.mesh.rotation.y = Math.atan2(tangent.x, tangent.z);
    }

    this.mesh.visible = true;
    const sc = scene || (typeof window !== 'undefined' ? window.scene : null);
    if (sc && !this.mesh.parent) {
      sc.add(this.mesh);
    }
  }

  update(delta, lightState, vehicleAhead, simulationRunning = true) {
    if (!this.active) return;

    // When simulation is stopped (before BẬT ĐIỆN! or paused), all vehicles stand completely still
    if (!simulationRunning) {
      this.speed = 0;
      if (this.pathData) {
        const t = Math.max(0, Math.min(1, this.progress / this.totalLength));
        const pt = this.pathData.getPointAt(t);
        const tangent = this.pathData.getTangentAt(t);
        this.mesh.position.set(pt.x, pt.y || 0.04, pt.z);
        this.mesh.rotation.y = Math.atan2(tangent.x, tangent.z);
      }
      return;
    }

    if (this.completed) return;

    this.age += delta;

    if (this.crashed) {
      this.speed = 0;
      return;
    }

    // 0. Departure delay countdown (Giây xuất phát trễ)
    if (this.delayRemaining > 0) {
      this.delayRemaining -= delta;
      this.speed = 0;
      return; // Still waiting at the starting line!
    }

    let desiredSpeed = this.targetSpeed;
    const distToStop = this.stopLineDistance - this.progress;

    // 1. Traffic Light Behavior (Respect or Free Run)
    if (this.ignoreLights) {
      // Free Run: Never stops for traffic lights!
      // Maintains target speed all the way through intersection
      this.passedStopLine = true;
    } else {
      // Normal: Respect traffic lights
      if (!this.passedStopLine) {
        if (distToStop > -0.5) {
          // Still approaching or at stop line
          if (lightState === 'red' || lightState === 'yellow') {
            if (distToStop > 0 && distToStop < 28.0) {
              const brakeDist = Math.max(0.01, distToStop - (this.length * 0.5 + 1.2));
              desiredSpeed = Math.min(desiredSpeed, Math.sqrt(2 * this.deceleration * brakeDist));
              if (brakeDist <= 0.25 || distToStop <= (this.length * 0.5 + 1.2)) {
                desiredSpeed = 0;
              }
            }
          } else {
            // Light is GREEN: accelerate and cross
            desiredSpeed = this.targetSpeed;
            if (distToStop <= 0) {
              this.passedStopLine = true;
            }
          }
        } else {
          this.passedStopLine = true;
        }
      }
    }

    // 2. Safe Car-Following (Queueing behind vehicle ahead on same path)
    if (vehicleAhead && vehicleAhead.active && !vehicleAhead.completed) {
      const distAhead = vehicleAhead.progress - this.progress;
      const minSafeGap = (this.length + vehicleAhead.length) * 0.5 + 2.0;

      if (distAhead > 0 && distAhead < minSafeGap * 3.5) {
        if (distAhead <= minSafeGap) {
          desiredSpeed = Math.min(desiredSpeed, Math.max(0, vehicleAhead.speed * 0.5));
          if (distAhead <= minSafeGap * 0.85) {
            desiredSpeed = 0;
          }
        } else {
          const factor = (distAhead - minSafeGap) / (minSafeGap * 2.5);
          desiredSpeed = Math.min(desiredSpeed, vehicleAhead.speed + factor * this.targetSpeed);
        }
      }
    }

    // 3. Acceleration / Deceleration
    if (this.speed < desiredSpeed) {
      this.speed = Math.min(desiredSpeed, this.speed + this.acceleration * delta);
    } else if (this.speed > desiredSpeed) {
      this.speed = Math.max(desiredSpeed, this.speed - this.deceleration * delta);
    }

    // 4. Update Position along Spline
    this.progress += this.speed * delta;

    if (this.progress >= this.totalLength) {
      this.completed = true;
      this.mesh.visible = false;
      return;
    }

    const t = Math.max(0, Math.min(1, this.progress / this.totalLength));
    const pt = this.pathData.getPointAt(t);
    const tangent = this.pathData.getTangentAt(t);

    this.mesh.position.set(pt.x, pt.y || 0.04, pt.z);
    this.mesh.rotation.y = Math.atan2(tangent.x, tangent.z);

    // 5. Spin Wheels
    if (this.wheels && this.wheels.length > 0) {
      const wheelAngularSpeed = (this.speed * delta) / 0.42;
      for (let i = 0; i < this.wheels.length; i++) {
        this.wheels[i].rotation.x += wheelAngularSpeed;
      }
    }
  }

  destroy(scene) {
    if (this.mesh && this.mesh.parent) {
      this.mesh.parent.remove(this.mesh);
    }
    this.active = false;
  }
}

// -------------------------------------------------------------
// 6. Traffic Light Manager
// -------------------------------------------------------------
class TrafficLightManager {
  constructor() {
    this.settings = {
      north: { green: 5, yellow: 2, red: 7, startColor: 'red' },
      south: { green: 5, yellow: 2, red: 7, startColor: 'red' },
      east: { green: 5, yellow: 2, red: 7, startColor: 'green' },
      west: { green: 5, yellow: 2, red: 7, startColor: 'green' }
    };

    this.state = {
      north: 'red',
      south: 'red',
      east: 'green',
      west: 'green'
    };

    this.timer = {
      north: 7,
      south: 7,
      east: 5,
      west: 5
    };

    this.elapsed = {
      north: 0,
      south: 0,
      east: 0,
      west: 0
    };

    this.running = false; // Frozen before BẬT ĐIỆN!
  }

  updateSettings(newSettings = {}) {
    if (!newSettings) return;
    ['north', 'south', 'east', 'west'].forEach((dir) => {
      if (newSettings[dir]) {
        const s = newSettings[dir];
        this.settings[dir] = {
          green: Math.max(1, parseInt(s.green, 10) || 5),
          yellow: Math.max(1, parseInt(s.yellow, 10) || 2),
          red: Math.max(1, parseInt(s.red, 10) || 7),
          startColor: s.startColor || s.start || this.settings[dir].startColor || 'red'
        };
      }
    });
    if (!this.running) {
      this.reset();
    }
  }

  reset() {
    ['north', 'south', 'east', 'west'].forEach((dir) => {
      const s = this.settings[dir];
      const startCol = s.startColor || 'red';
      this.state[dir] = startCol;
      this.timer[dir] = s[startCol] || 5;
      this.elapsed[dir] = 0;
    });
    this.notifyExternal();
  }

  update(delta) {
    if (!this.running) return;

    let changed = false;
    ['north', 'south', 'east', 'west'].forEach((dir) => {
      const s = this.settings[dir];
      this.elapsed[dir] += delta;

      const curColor = this.state[dir];
      const totalDur = s[curColor] || 5;
      const timeLeft = Math.max(1, Math.ceil(totalDur - this.elapsed[dir]));

      if (this.timer[dir] !== timeLeft) {
        this.timer[dir] = timeLeft;
        changed = true;
      }

      if (this.elapsed[dir] >= totalDur) {
        this.elapsed[dir] = 0;
        if (curColor === 'green') {
          this.state[dir] = 'yellow';
          this.timer[dir] = s.yellow;
        } else if (curColor === 'yellow') {
          this.state[dir] = 'red';
          this.timer[dir] = s.red;
        } else {
          this.state[dir] = 'green';
          this.timer[dir] = s.green;
        }
        changed = true;
      }
    });

    if (changed) {
      this.notifyExternal();
    }
  }

  notifyExternal() {
    ['north', 'south', 'east', 'west'].forEach((dir) => {
      const curState = this.state[dir];
      const curTimer = this.timer[dir];

      if (typeof window !== 'undefined') {
        if (window.TrafficUI && typeof window.TrafficUI.updateLightIndicator === 'function') {
          window.TrafficUI.updateLightIndicator(dir, curState, curTimer);
        }
        if (window.landmarksManager && typeof window.landmarksManager.setTrafficLight === 'function') {
          window.landmarksManager.setTrafficLight(dir, curState, curTimer);
        } else if (window.TrafficLights && typeof window.TrafficLights.setTrafficLight === 'function') {
          window.TrafficLights.setTrafficLight(dir, curState, curTimer);
        }
        window.dispatchEvent(new CustomEvent('light:update', {
          detail: { direction: dir, state: curState, timer: curTimer }
        }));
      }
    });
  }

  getLightState(direction) {
    return this.state[String(direction).toLowerCase()] || 'red';
  }
}

class TrafficManager {
  constructor(scene, options = {}) {
    this.scene = scene || (typeof window !== 'undefined' ? window.scene : null);
    this.vehicles = [];
    this.lights = new TrafficLightManager();
    this.explosions = new ExplosionSystem(this.scene);
    this.simulationRunning = false; // Frozen before BẬT ĐIỆN!
    this.crashCount = 0;

    // Use high-precision visible waypoint trajectories
    this.waypoints = createVisibleWaypoints();

    this.onCrash = options.onCrash || null;
    this.onSafeCross = options.onSafeCross || null;

    this.initEventListeners();

    // Pull initial UI settings if already available
    if (typeof window !== 'undefined') {
      const pullSettings = () => {
        if (window.TrafficUI && typeof window.TrafficUI.getAllLightSettings === 'function') {
          const s = window.TrafficUI.getAllLightSettings();
          if (s) this.lights.updateSettings(s);
        }
        this.lights.reset();
      };
      pullSettings();
      setTimeout(pullSettings, 150);
      setTimeout(pullSettings, 600);
    }
  }

  setScene(scene) {
    this.scene = scene;
    this.explosions.scene = scene;
  }

  initEventListeners() {
    if (typeof window === 'undefined') return;

    window.addEventListener('sim:start', (e) => {
      this.simulationRunning = true;
      this.lights.running = true;
      if (e.detail && e.detail.settings) {
        this.lights.updateSettings(e.detail.settings);
      }
    });

    window.addEventListener('sim:stop', () => {
      this.simulationRunning = false;
      this.lights.running = false;
    });

    window.addEventListener('sim:reset', () => {
      this.reset();
    });

    // Custom DOM event listener with duplicate ID guard
    window.addEventListener('vehicle:spawn', (e) => {
      if (e.detail) {
        if (e.detail.id && this.vehicles.some(v => v.id === e.detail.id)) return;
        this.spawnVehicle(e.detail);
      }
    });

    window.addEventListener('vehicle:remove', (e) => {
      if (e.detail && e.detail.id) {
        this.removeVehicle(e.detail.id);
      }
    });

    window.addEventListener('vehicle:clear', () => {
      this.clearVehicles();
    });

    window.addEventListener('light:config', (e) => {
      if (e.detail) {
        this.lights.updateSettings(e.detail);
      }
    });

    // Global callback with duplicate ID guard
    window.onVehicleSpawn = (data) => {
      if (!data) return;
      if (data.id && this.vehicles.some(v => v.id === data.id)) return;
      this.spawnVehicle(data);
    };

    window.onSimulationStart = (settings) => {
      this.simulationRunning = true;
      this.lights.running = true;
      if (settings) this.lights.updateSettings(settings);
    };
    window.onSimulationStop = () => {
      this.simulationRunning = false;
      this.lights.running = false;
    };
    window.onSimulationReset = () => this.reset();
  }

  /**
   * Spawns a vehicle on visible road, queuing behind existing vehicles if any.
   */
  spawnVehicle(options = {}) {
    // 1. Strict Duplicate Check: Never spawn the same vehicle ID twice
    if (options.id && this.vehicles.some(v => v.id === options.id)) {
      console.log(`[traffic] Vehicle with id "${options.id}" already exists, skipping duplicate.`);
      return null;
    }

    const origin = (options.origin || 'south').toLowerCase();
    const turn = (options.turn || 'straight').toLowerCase();
    const type = (options.type || 'car').toLowerCase();
    const color = options.color || '#3b82f6';
    const id = options.id || ('veh_' + Date.now() + '_' + Math.floor(Math.random() * 1000));

    // Rapid double-trigger throttling (within 80ms)
    const now = Date.now();
    const sig = `${origin}_${turn}_${type}_${color}`;
    if (this._lastSpawnSig === sig && (now - (this._lastSpawnTime || 0)) < 80) {
      console.log(`[traffic] Rapid duplicate spawn detected (${sig}), skipping.`);
      return null;
    }
    this._lastSpawnSig = sig;
    this._lastSpawnTime = now;

    const wp = this.waypoints;
    if (!wp || !wp[origin] || !wp[origin][turn]) {
      console.error(`Cannot find visible trajectory for origin "${origin}" and turn "${turn}"!`);
      return null;
    }

    const pathData = wp[origin][turn];
    const stopLineDist = wp[origin].stopLineDist || 28.0;

    // Approximate vehicle length for queue calculation
    let vehLength = 4.4;
    if (type === 'bus') vehLength = 9.8;
    else if (type === 'bike' || type === 'motorbike') vehLength = 2.3;

    let initialProgress = 0;

    if (!this.simulationRunning) {
      // PRE-START SETUP MODE: Place vehicle at stop line!
      // In createVisibleWaypoints, straight & left use inner lane, right uses outer lane
      const isRight = (turn === 'right');
      const sameLaneVehicles = this.vehicles.filter(v => {
        if (v.origin !== origin) return false;
        const vIsRight = (v.turn === 'right');
        return vIsRight === isRight;
      });

      if (sameLaneVehicles.length === 0) {
        // First vehicle at stop line: front bumper 1.2m behind stop line
        initialProgress = Math.max(0, stopLineDist - (vehLength * 0.5 + 1.2));
      } else {
        // Queue neatly behind the rearmost vehicle on this lane
        let minProg = Infinity;
        let frontVeh = null;
        for (let i = 0; i < sameLaneVehicles.length; i++) {
          const v = sameLaneVehicles[i];
          if (v.initialProgress < minProg) {
            minProg = v.initialProgress;
            frontVeh = v;
          }
        }
        const gap = 1.8;
        const frontHalf = frontVeh ? (frontVeh.length * 0.5) : 2.2;
        initialProgress = Math.max(-20.0, minProg - (frontHalf + vehLength * 0.5 + gap));
      }
    } else {
      // MID-SIMULATION SPAWN: Visible road entrance (progress = 0)
      const sameLaneVehicles = this.vehicles.filter(v => 
        v.origin === origin && v.turn === turn && v.active && !v.completed
      );
      if (sameLaneVehicles.length > 0) {
        let minProg = Infinity;
        sameLaneVehicles.forEach(v => {
          if (v.progress < minProg) minProg = v.progress;
        });
        if (minProg < 14.0) {
          initialProgress = Math.max(-20.0, minProg - 7.5);
        }
      }
    }

    const vehicle = new Vehicle({
      id,
      type,
      origin,
      turn,
      color,
      taxiType: options.taxiType,
      pathData,
      stopLineDistance: stopLineDist,
      initialProgress,
      // Pass programmed timing & free run mode
      delay: options.delay || options.startDelay || options.delaySeconds,
      speed: options.speed,
      speedMultiplier: options.speedMultiplier,
      ignoreLights: options.ignoreLights,
      lightMode: options.lightMode,
      mode: options.mode,
      lightBehavior: options.lightBehavior
    });

    // Ensure added to scene
    const targetScene = this.scene || (typeof window !== 'undefined' ? window.scene : null);
    if (targetScene) {
      this.scene = targetScene;
      targetScene.add(vehicle.mesh);
    } else {
      console.warn("Scene not ready yet when spawning vehicle, holding reference.");
    }

    this.vehicles.push(vehicle);
    console.log(`🚗 Spawned ${type} from ${origin} turning ${turn} (${color}) at progress ${initialProgress.toFixed(1)} [delay: ${vehicle.delayRemaining}s, freeRun: ${vehicle.ignoreLights}, simRunning: ${this.simulationRunning}]`);
    return vehicle;
  }

  removeVehicle(id) {
    const idx = this.vehicles.findIndex(v => v.id === id);
    if (idx !== -1) {
      const v = this.vehicles[idx];
      v.destroy(this.scene);
      this.vehicles.splice(idx, 1);
    }
  }

  clearVehicles() {
    this.vehicles.forEach(v => v.destroy(this.scene));
    this.vehicles = [];
    this.explosions.clear();
  }

  reset() {
    this.simulationRunning = false;
    this.lights.running = false;
    this.lights.reset();
    this.crashCount = 0;
    this.safeCount = 0;
    this.explosions.clear();

    // Khôi phục tất cả xe đã setup trở lại vị trí chờ trước vạch dừng
    for (let i = 0; i < this.vehicles.length; i++) {
      this.vehicles[i].resetPosition(this.scene);
    }
    console.log(`🔄 Simulation reset: all ${this.vehicles.length} setup vehicles restored to stop line waiting spots.`);
  }

  /**
   * Collision Detection Logic
   * Guards:
   * 1. Only active when simulation is running.
   * 2. Cannot collide if still behind stop line.
   * 3. Same approach vehicles do not collide (safe following distance handles them).
   * 4. Only checks vehicles in or entering the intersection ([-22, 22]).
   */
  checkCollisions() {
    if (!this.simulationRunning) return;

    const n = this.vehicles.length;
    for (let i = 0; i < n; i++) {
      const v1 = this.vehicles[i];
      if (!v1.active || v1.completed || v1.crashed) continue;

      // Cannot collide if still behind stop line
      if (v1.progress < (v1.stopLineDistance - 2.0)) continue;

      const p1 = v1.mesh.position;
      const inIntersection1 = Math.abs(p1.x) < 22 && Math.abs(p1.z) < 22;

      for (let j = i + 1; j < n; j++) {
        const v2 = this.vehicles[j];
        if (!v2.active || v2.completed || v2.crashed) continue;
        if (v1.id === v2.id) continue;

        // Cannot collide if still behind stop line
        if (v2.progress < (v2.stopLineDistance - 2.0)) continue;

        // Same origin vehicles do not collide (safe distance handles queueing)
        if (v1.origin === v2.origin) continue;

        const p2 = v2.mesh.position;
        const inIntersection2 = Math.abs(p2.x) < 22 && Math.abs(p2.z) < 22;

        // At least one vehicle must be in the intersection area
        if (!inIntersection1 && !inIntersection2) continue;

        // Distance check between vehicle centers on XZ ground plane
        const distXZ = Math.hypot(p1.x - p2.x, p1.z - p2.z);
        const crashThreshold = (v1.length + v2.length) * 0.32;

        if (distXZ < crashThreshold) {
          // Real intersection collision!
          v1.crashed = true;
          v2.crashed = true;
          v1.speed = 0;
          v2.speed = 0;

          // Physical collision impact recoil: tilt meshes
          v1.mesh.rotation.z += (Math.random() - 0.5) * 0.35;
          v1.mesh.rotation.x += (Math.random() - 0.5) * 0.25;
          v2.mesh.rotation.z += (Math.random() - 0.5) * 0.35;
          v2.mesh.rotation.x += (Math.random() - 0.5) * 0.25;

          const crashPos = new THREE.Vector3()
            .addVectors(p1, p2)
            .multiplyScalar(0.5);
          crashPos.y = 1.0;

          this.explosions.createExplosion(crashPos);
          this.crashCount++;

          console.warn(`💥 Collision between ${v1.id} and ${v2.id} at:`, crashPos);

          if (typeof this.onCrash === 'function') {
            this.onCrash(v1, v2, crashPos);
          }
          if (typeof window !== 'undefined') {
            if (window.TrafficUI && typeof window.TrafficUI.onCrash === 'function') {
              window.TrafficUI.onCrash(v1);
            } else if (typeof window.onCrash === 'function') {
              window.onCrash(v1);
            }
          }
        }
      }
    }
  }

  /**
   * Main simulation step called per frame by scene.js requestAnimationFrame
   */
  update(delta) {
    // Ensure scene reference is bound
    if (!this.scene && typeof window !== 'undefined' && window.scene) {
      this.setScene(window.scene);
    }

    // 1. Update Traffic Lights (internally checks if running)
    this.lights.update(delta);

    // 2. Update Vehicles
    for (let i = 0; i < this.vehicles.length; i++) {
      const veh = this.vehicles[i];
      if (!veh.active) continue;

      // Find vehicle immediately ahead on same track
      let ahead = null;
      let minGap = Infinity;
      for (let j = 0; j < this.vehicles.length; j++) {
        if (i === j) continue;
        const other = this.vehicles[j];
        if (other.origin === veh.origin && other.turn === veh.turn && other.active && !other.completed) {
          const gap = other.progress - veh.progress;
          if (gap > 0 && gap < minGap) {
            minGap = gap;
            ahead = other;
          }
        }
      }

      const lightState = this.lights.getLightState(veh.origin);
      veh.update(delta, lightState, ahead, this.simulationRunning);

      // Safe cross check
      if (this.simulationRunning && veh.completed && !veh.crashed && !veh._safeReported) {
        veh._safeReported = true;
        this.safeCount++;
        if (typeof this.onSafeCross === 'function') {
          this.onSafeCross(veh);
        }
        if (typeof window !== 'undefined') {
          if (window.TrafficUI && typeof window.TrafficUI.onSafeCross === 'function') {
            window.TrafficUI.onSafeCross(veh);
          } else if (typeof window.onSafeCross === 'function') {
            window.onSafeCross(veh);
          }
        }
      }
    }

    // 3. Collision Detection (only when simulationRunning)
    if (this.simulationRunning) {
      this.checkCollisions();
    }

    // 4. Update Particle Explosions
    this.explosions.update(delta);
  }
}

    }
    window.trafficManager = defaultTrafficManager;

      ctx.fillRect(0, 0, width, height);

      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 10;
      ctx.strokeRect(6, 6, width - 12, height - 12);

      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 4;
      ctx.strokeRect(14, 14, width - 28, height - 28);

      let activeColor = '#ef4444';
      let glowColor = 'rgba(239, 68, 68, 0.4)';
      if (curState === 'yellow') {
        activeColor = '#eab308';
        glowColor = 'rgba(234, 179, 8, 0.4)';
      } else if (curState === 'green') {
        activeColor = '#22c55e';
        glowColor = 'rgba(34, 197, 94, 0.4)';
      }

      ctx.font = 'bold 140px "Courier New", monospace, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
      ctx.fillText('88', width / 2, height / 2 + 6);

      const secStr = Math.max(0, parseInt(sec, 10) || 0).toString().padStart(2, '0');
      ctx.shadowColor = glowColor;
      ctx.shadowBlur = 18;
      ctx.fillStyle = activeColor;
      ctx.fillText(secStr, width / 2, height / 2 + 6);

      ctx.shadowBlur = 0;
      ctx.font = 'bold 22px Arial, sans-serif';
      ctx.fillStyle = '#94a3b8';
      ctx.fillText('SEC', width / 2, height - 26);
    };

    draw(initialSeconds, state);
    const texture = new THREE.CanvasTexture(canvas);
    texture.anisotropy = 4;

    return {
      canvas,
      ctx,
      texture,
      update(sec, curState) {
        draw(sec, curState);
        texture.needsUpdate = true;
      }
    };
  },

      ctx.fillStyle = '#da251d';
      ctx.fillRect(0, 0, w, h);

      const cx = w / 2;
      const cy = h / 2;
      const outerR = h * 0.3;
      const innerR = (outerR * Math.sin(Math.PI / 10)) / Math.cos(Math.PI / 5);

      ctx.beginPath();
      ctx.fillStyle = '#ffff00';
      for (let i = 0; i < 10; i++) {
        const r = i % 2 === 0 ? outerR : innerR;
        const angle = (i * Math.PI) / 5 - Math.PI / 2;
        const x = cx + r * Math.cos(angle);
        const y = cy + r * Math.sin(angle);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fill();
    }).texture;

        ctx.lineWidth = 10;

// 2. Traffic Light Post with 3D Countdown Controller
// -------------------------------------------------------------
class TrafficLightController {
  constructor(scene, direction, position, rotationY, armLength = 5.2) {
    this.scene = scene;
    this.direction = direction;
    this.state = 'red';
    this.countdown = 15;
    this.group = new THREE.Group();
    this.group.name = `TrafficLight_${direction}`;
    this.group.position.set(position.x, position.y !== undefined ? position.y : 0.28, position.z);
    this.group.rotation.y = rotationY;

    const poleMat = new THREE.MeshStandardMaterial({
      color: 0x64748b,
      metalness: 0.65,
      roughness: 0.3
    });
    const housingMat = new THREE.MeshStandardMaterial({
      color: 0x18181b,
      metalness: 0.2,
      roughness: 0.5
    });

    // Vertical Galvanized Steel Pole
    const poleGeo = new THREE.CylinderGeometry(0.18, 0.22, 6.5, 16);
    const pole = new THREE.Mesh(poleGeo, poleMat);
    pole.position.y = 3.25;
    pole.castShadow = true;
    pole.receiveShadow = true;
    this.group.add(pole);

    const baseGeo = new THREE.CylinderGeometry(0.35, 0.4, 0.3, 16);
    const base = new THREE.Mesh(baseGeo, poleMat);
    base.position.y = 0.15;
    this.group.add(base);

    // Cantilever Mast Arm extending along local +X (to the right, over oncoming lanes)
    const armGeo = new THREE.CylinderGeometry(0.12, 0.16, armLength, 16);
    const arm = new THREE.Mesh(armGeo, poleMat);
    arm.rotation.z = Math.PI / 2;
    arm.position.set(armLength / 2, 5.8, 0);
    arm.castShadow = true;
    this.group.add(arm);

    const strutGeo = new THREE.CylinderGeometry(0.06, 0.06, 2.2, 12);
    const strut = new THREE.Mesh(strutGeo, poleMat);
    strut.rotation.z = Math.PI / 4;
    strut.position.set(0.8, 5.0, 0);
    this.group.add(strut);

    // Main Overhead Traffic Signal Head (facing local -Z towards oncoming traffic)
    const headGroup = new THREE.Group();
    headGroup.position.set(armLength - 0.5, 5.4, 0);

    const boxGeo = new THREE.BoxGeometry(0.7, 1.9, 0.4);
    const boxMesh = new THREE.Mesh(boxGeo, housingMat);
    boxMesh.castShadow = true;
    headGroup.add(boxMesh);

    const visorGeo = new THREE.CylinderGeometry(0.24, 0.24, 0.2, 16, 1, true, 0, Math.PI);
    visorGeo.rotateX(-Math.PI / 2);
    const visorMat = new THREE.MeshStandardMaterial({ color: 0x09090b });

    const lensGeo = new THREE.SphereGeometry(0.2, 24, 24);

    // Red light
    this.redMat = new THREE.MeshStandardMaterial({
      color: 0xef4444,
      emissive: 0xef4444,
      emissiveIntensity: 1.0,
      roughness: 0.2
    });
    this.redLens = new THREE.Mesh(lensGeo, this.redMat);
    this.redLens.position.set(0, 0.55, -0.18);
    headGroup.add(this.redLens);

    const redVisor = new THREE.Mesh(visorGeo, visorMat);
    redVisor.position.set(0, 0.65, -0.2);
    headGroup.add(redVisor);

    // Yellow light
    this.yellowMat = new THREE.MeshStandardMaterial({
      color: 0x451a03,
      emissive: 0x000000,
      emissiveIntensity: 0.0,
      roughness: 0.2
    });
    this.yellowLens = new THREE.Mesh(lensGeo, this.yellowMat);
    this.yellowLens.position.set(0, 0.0, -0.18);
    headGroup.add(this.yellowLens);

    const yellowVisor = new THREE.Mesh(visorGeo, visorMat);
    yellowVisor.position.set(0, 0.1, -0.2);
    headGroup.add(yellowVisor);

    // Green light
    this.greenMat = new THREE.MeshStandardMaterial({
      color: 0x052e16,
      emissive: 0x000000,
      emissiveIntensity: 0.0,
      roughness: 0.2
    });
    this.greenLens = new THREE.Mesh(lensGeo, this.greenMat);
    this.greenLens.position.set(0, -0.55, -0.18);
    headGroup.add(this.greenLens);

    const greenVisor = new THREE.Mesh(visorGeo, visorMat);
    greenVisor.position.set(0, -0.45, -0.2);
    headGroup.add(greenVisor);

    this.lightGlow = new THREE.PointLight(0xef4444, 2.5, 14, 1.2);
    this.lightGlow.position.set(0, 0.55, -0.8);
    headGroup.add(this.lightGlow);

    this.group.add(headGroup);

    // 3D Digital Countdown LED Screen Box (Dual-sided for 360° visibility)
    const countBoxGeo = new THREE.BoxGeometry(1.2, 1.2, 0.3);
    const countBox = new THREE.Mesh(countBoxGeo, housingMat);
    countBox.position.set(armLength - 1.8, 5.4, 0);

    this.countdownDisplay = CanvasHelper.createCountdownDisplay(this.countdown, this.state);
    const countFaceMat = new THREE.MeshBasicMaterial({
      map: this.countdownDisplay.texture
    });

    const countFaceFront = new THREE.Mesh(new THREE.PlaneGeometry(1.15, 1.15), countFaceMat);
    countFaceFront.rotation.y = Math.PI;
    countFaceFront.position.set(0, 0, -0.16);
    countBox.add(countFaceFront);

    const countFaceBack = new THREE.Mesh(new THREE.PlaneGeometry(1.15, 1.15), countFaceMat);
    countFaceBack.position.set(0, 0, 0.16);
    countBox.add(countFaceBack);

    this.group.add(countBox);

    // Lower Pedestrian Signal on pole
    const pedBoxGeo = new THREE.BoxGeometry(0.5, 1.1, 0.3);
    const pedBox = new THREE.Mesh(pedBoxGeo, housingMat);
    pedBox.position.set(0, 2.6, 0);
    this.group.add(pedBox);

    const pedLensGeo = new THREE.SphereGeometry(0.14, 16, 16);
    this.pedRedLens = new THREE.Mesh(pedLensGeo, this.redMat);
    this.pedRedLens.position.set(0, 2.85, -0.18);
    this.group.add(this.pedRedLens);

    this.pedGreenLens = new THREE.Mesh(pedLensGeo, this.greenMat);
    this.pedGreenLens.position.set(0, 2.35, -0.18);
    this.group.add(this.pedGreenLens);

    scene.add(this.group);
    this.setState('red', 15);
  }

  setState(state, countdown) {
    this.state = state || this.state;
    if (countdown !== undefined) this.countdown = countdown;

    if (this.state === 'red') {
      this.redMat.color.setHex(0xef4444);
      this.redMat.emissive.setHex(0xef4444);
      this.redMat.emissiveIntensity = 1.2;

      this.yellowMat.color.setHex(0x451a03);
      this.yellowMat.emissive.setHex(0x000000);
      this.yellowMat.emissiveIntensity = 0.0;

      this.greenMat.color.setHex(0x052e16);
      this.greenMat.emissive.setHex(0x000000);
      this.greenMat.emissiveIntensity = 0.0;

      this.lightGlow.color.setHex(0xef4444);
      this.lightGlow.intensity = 2.5;

      this.pedRedLens.material = this.redMat;
      this.pedGreenLens.material = this.greenMat;
    } else if (this.state === 'yellow') {
      this.redMat.color.setHex(0x450a0a);
      this.redMat.emissive.setHex(0x000000);
      this.redMat.emissiveIntensity = 0.0;

      this.yellowMat.color.setHex(0xfbbf24);
      this.yellowMat.emissive.setHex(0xfbbf24);
      this.yellowMat.emissiveIntensity = 1.2;

      this.greenMat.color.setHex(0x052e16);
      this.greenMat.emissive.setHex(0x000000);
      this.greenMat.emissiveIntensity = 0.0;

      this.lightGlow.color.setHex(0xfbbf24);
      this.lightGlow.intensity = 2.2;
    } else if (this.state === 'green') {
      this.redMat.color.setHex(0x450a0a);
      this.redMat.emissive.setHex(0x000000);
      this.redMat.emissiveIntensity = 0.0;

      this.yellowMat.color.setHex(0x451a03);
      this.yellowMat.emissive.setHex(0x000000);
      this.yellowMat.emissiveIntensity = 0.0;

      this.greenMat.color.setHex(0x22c55e);
      this.greenMat.emissive.setHex(0x22c55e);
      this.greenMat.emissiveIntensity = 1.2;

      this.lightGlow.color.setHex(0x22c55e);
      this.lightGlow.intensity = 2.5;

      this.pedRedLens.material = this.redMat;
      this.pedGreenLens.material = this.greenMat;
    }

    if (this.countdownDisplay) {
      this.countdownDisplay.update(this.countdown, this.state);
    }
  }
}

  blockMesh.receiveShadow = true;

  const roofGeo = new THREE.ConeGeometry(bldW * 0.9, 3.6, 4);
  roofGeo.rotateY(Math.PI / 4);
  const roofMesh = new THREE.Mesh(roofGeo, roofMat);
  roofMesh.scale.set(1.3, 1.0, 2.4);

    const ledge = new THREE.Mesh(ledgeGeo, railingMat);
    ledge.position.set(bldW / 2 + 0.8, y, 0);
    schoolBuilding.add(ledge);

    const railGeo = new THREE.BoxGeometry(0.1, 0.9, bldL - 2);
    const rail = new THREE.Mesh(railGeo, railingMat);
    rail.position.set(bldW / 2 + 1.5, y + 0.45, 0);
    schoolBuilding.add(rail);

    for (let z = -12; z <= 12; z += 4) {
      const winGeo = new THREE.BoxGeometry(0.1, 1.8, 2.2);
      const winMesh = new THREE.Mesh(winGeo, shutterMat);
      winMesh.position.set(bldW / 2 + 0.05, y + 1.2, z);
      schoolBuilding.add(winMesh);

      const glassGeo = new THREE.PlaneGeometry(1.6, 1.4);
      const glassMat = new THREE.MeshStandardMaterial({
        color: 0x93c5fd,
        roughness: 0.1,
        metalness: 0.8
      });
      const glass = new THREE.Mesh(glassGeo, glassMat);
      glass.rotation.y = Math.PI / 2;
      glass.position.set(bldW / 2 + 0.12, y + 1.2, z);
      schoolBuilding.add(glass);

  // Top School Name Billboard
  const topSignGeo = new THREE.PlaneGeometry(14, 2.2);

    roughness: 0.3

  topSign.rotation.y = Math.PI / 2;
  topSign.position.set(bldW / 2 + 0.1, bldH - 1.2, 0);

  group.add(schoolBuilding);

  // Perimeter Wall

  const wallN = new THREE.Mesh(new THREE.BoxGeometry(34, 1.2, 0.4), wallMat);
  wallN.position.set(cx, 0.88, 16.5);
  wallN.castShadow = true;
  group.add(wallN);

  const fenceN = new THREE.Mesh(new THREE.BoxGeometry(34, 1.0, 0.1), ironFenceMat);
  fenceN.position.set(cx, 1.98, 16.5);
  group.add(fenceN);

  const wallE1 = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.2, 10), wallMat);
  wallE1.position.set(-16.5, 0.88, 22);
  group.add(wallE1);

  const fenceE1 = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.0, 10), ironFenceMat);
  fenceE1.position.set(-16.5, 1.98, 22);
  group.add(fenceE1);

  const wallE2 = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.2, 16), wallMat);
  wallE2.position.set(-16.5, 0.88, 44);
  group.add(wallE2);

  const fenceE2 = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.0, 16), ironFenceMat);
  fenceE2.position.set(-16.5, 1.98, 44);
  group.add(fenceE2);

  // Grand School Gate
  const gateGroup = new THREE.Group();
  gateGroup.position.set(-16.5, 0.28, 31);

  const pillarGeo = new THREE.BoxGeometry(1.2, 4.5, 1.2);
  const pillarMat = new THREE.MeshStandardMaterial({ color: 0xb45309, roughness: 0.6 });
  const pillar1 = new THREE.Mesh(pillarGeo, pillarMat);
  pillar1.position.set(0, 2.25, -3.2);
  pillar1.castShadow = true;
  gateGroup.add(pillar1);

  const pillar2 = new THREE.Mesh(pillarGeo, pillarMat);
  pillar2.position.set(0, 2.25, 3.2);
  pillar2.castShadow = true;
  gateGroup.add(pillar2);

  const capGeo = new THREE.ConeGeometry(1.0, 0.8, 4);
  capGeo.rotateY(Math.PI / 4);
  const capMesh1 = new THREE.Mesh(capGeo, roofMat);
  capMesh1.position.set(0, 4.9, -3.2);
  gateGroup.add(capMesh1);

  const capMesh2 = new THREE.Mesh(capGeo, roofMat);
  capMesh2.position.set(0, 4.9, 3.2);
  gateGroup.add(capMesh2);

  const signBoardGeo = new THREE.BoxGeometry(0.4, 1.6, 6.2);
  const signBoardMesh = new THREE.Mesh(signBoardGeo, schoolWallMat);
  signBoardMesh.position.set(0, 4.1, 0);
  signBoardMesh.castShadow = true;
  gateGroup.add(signBoardMesh);

  const signFaceGeo = new THREE.PlaneGeometry(6.0, 1.4);
  const signFaceMat = new THREE.MeshBasicMaterial({
    map: CanvasHelper.createSchoolSignTexture()
  });
  const signFaceFront = new THREE.Mesh(signFaceGeo, signFaceMat);
  signFaceFront.rotation.y = Math.PI / 2;
  signFaceFront.position.set(0.22, 4.1, 0);
  gateGroup.add(signFaceFront);

  const sloganGeo = new THREE.PlaneGeometry(5.8, 0.9);
  const sloganMat = new THREE.MeshBasicMaterial({
    map: CanvasHelper.createSchoolSloganTexture()
  });
  const sloganMesh = new THREE.Mesh(sloganGeo, sloganMat);
  sloganMesh.rotation.y = -Math.PI / 2;
  sloganMesh.position.set(-0.22, 4.1, 0);
  gateGroup.add(sloganMesh);

  const gateDoorGeo = new THREE.BoxGeometry(0.1, 2.6, 2.6);
  const door1 = new THREE.Mesh(gateDoorGeo, ironFenceMat);
  door1.position.set(-0.6, 1.3, -1.8);
  door1.rotation.y = 0.4;
  gateGroup.add(door1);

  const door2 = new THREE.Mesh(gateDoorGeo, ironFenceMat);
  door2.position.set(-0.6, 1.3, 1.8);
  door2.rotation.y = -0.4;
  gateGroup.add(door2);

  group.add(gateGroup);

  // Flagpole & National Flag
  const flagGroup = new THREE.Group();
  flagGroup.position.set(cx + 8, 0.28, cz);

  const step1 = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 1.8, 0.3, 16), railingMat);
  step1.position.y = 0.15;
  flagGroup.add(step1);
  const step2 = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.4, 0.3, 16), railingMat);
  step2.position.y = 0.45;
  flagGroup.add(step2);

  const poleGeo = new THREE.CylinderGeometry(0.08, 0.12, 9.0, 16);
  const poleMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, metalness: 0.9, roughness: 0.2 });

  const flagGeo = new THREE.PlaneGeometry(2.4, 1.6, 16, 8);
  const pos = flagGeo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const u = (pos.getX(i) + 1.2) / 2.4;

  flagGeo.computeVertexNormals();

    map: CanvasHelper.createVietnamFlagTexture(),

  });
  const flagMesh = new THREE.Mesh(flagGeo, flagMat);
  flagMesh.position.set(1.25, 8.4, 0);

    { x: cx + 11, z: cz + 10, type: 'flame' }

  });

    roughness: 0.6
  });

    roughness: 0.1,
    metalness: 0.8,
